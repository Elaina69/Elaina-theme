name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install MCP server dependencies
        run: npm ci --prefix src/src/plugins/mcp-server --no-audit --no-fund

      - name: Build MCP server
        run: npm run build --prefix src/src/plugins/mcp-server

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm run test

      - name: Test MCP transports
        run: npm test --prefix src/src/plugins/mcp-server
